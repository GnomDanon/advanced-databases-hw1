spring:
  application:
    name: clinic

  datasource:
    url: jdbc:postgresql://localhost:5432/clinic
    username: clinic
    password: clinic
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
